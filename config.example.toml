# cloud-email-archive — example configuration
# Copy to ~/.config/cloud-email-archive/config.toml and fill in your accounts.
#
#   archive_dir  where encrypted blobs live — put this INSIDE a folder that is
#                synced or mounted to your cloud: Nextcloud, Syncthing, Dropbox,
#                OneDrive, Google Drive, a Seafile library, an SMB/NFS share, or
#                an rclone mount (e.g. ~/Nextcloud/email-archive). The provider
#                only ever sees opaque .age files; content and names stay hidden.
#   key_file     age secret key — MUST stay OUTSIDE the synced folder.
#                Generate with: cloud-email-archive keygen
#   state_file   fetch bookkeeping (plaintext UIDs only, no mail content).
#
# Accounts as a list — each account type (Dovecot, Exchange, ...) is optional,
# add as many as you like. IMAP only; Exchange needs an app password if MFA is on.

archive_dir = "~/Nextcloud/email-archive"
key_file = "~/.config/cloud-email-archive/key.txt"
state_file = "~/.config/cloud-email-archive/state.json"

# --- example: university Dovecot ---
[[accounts]]
name = "faculty"
host = "imap.example.edu"               # your IMAP server
port = 993
security = "implicit"                   # implicit TLS on 993 (default) | starttls | none
user = "your-imap-user"
password = "app-password"               # plaintext in config...
# password_cmd = "cat ~/.config/imap-passwords/faculty"   # ...or read it from a secret store instead.
                                        # Set only ONE of password / password_cmd — having both is a config error.
folders = ["*"]                         # "*" (default) = all, or list: ["INBOX", "Archiv"]
                                        # a listed folder missing on the server fails the sync

# --- example: work Exchange (IMAP) ---
[[accounts]]
name = "work"
host = "outlook.example.edu"            # your Exchange IMAP endpoint
port = 993
security = "implicit"
user = "you@work.example.edu"
password = "change-me"                  # app password, if MFA is enabled
# folders = ["INBOX", "Gesendete Elemente"]

# Passphrase for a passphrase-protected key file (`keygen -passphrase`).
# Same pattern as password_cmd; ignored for plaintext key files.
# passphrase_cmd = "cat ~/.config/cea-key-passphrase"
