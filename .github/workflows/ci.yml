name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test (race detector, fuzz seed corpus)
        run: go test -race -count=1 ./...

      # date logic must not depend on the runner's timezone: the whole tool is
      # cutoff-based, and epoch/UTC-boundary assertions silently flipped year
      # under UTC+14/UTC-12 once (found by exactly this matrix)
      - name: Test (timezone matrix)
        run: |
          for tz in UTC Pacific/Kiritimati Etc/GMT+12 Europe/Berlin; do
            echo "TZ=$tz"
            TZ=$tz go test -count=1 ./... || exit 1
          done

      - name: Coverage
        run: go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out

  windows:
    # the release ships windows/amd64 binaries, so windows must at least
    # compile and pass the portable part of the suite. On windows the lock
    # stub is a no-op (concurrent runs unsupported, documented) and tests
    # injecting faults via POSIX dir permissions skip themselves.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (portable suite)
        run: go test -count=1 ./...

  integration:
    # real-server tier against Dovecot in Docker (foreign UIDPLUS/SEARCH/
    # INTERNALDATE implementations); opt-in locally via -tags integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Dovecot integration
        run: go test -tags integration -count=1 -timeout 600s -run TestDovecot -v ./...
