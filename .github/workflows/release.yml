name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests
        run: go test -race ./...
      - name: Build release binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            # separate statements: a `GOOS=... go build -o "...$GOOS..."`
            # command-prefix expands $GOOS BEFORE the assignment applies,
            # producing empty names
            GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/cloud-email-archive-$GOOS-$GOARCH" .
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body: "Binaries for cloud-email-archive ${{ github.ref_name }}. Verify checksums against SHA256SUMS."
