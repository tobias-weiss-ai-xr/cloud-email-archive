<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1200 742" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>cloud-email-archive — how it works</title>
  <desc>Pictogram flow: IMAP accounts → client-side age encryption → content-addressed encrypted blobs → synced cloud folder that only ever sees opaque blobs.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7DD3FC"/>
    </marker>
    <!-- encrypted blob card: padlock + hash bars -->
    <g id="blobcard">
      <rect width="84" height="52" rx="6" fill="#1B2A4A" stroke="#3B5480" stroke-width="2"/>
      <path d="M12,28 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
      <rect x="9" y="28" width="16" height="14" rx="2.5" fill="#F59E0B"/>
      <rect x="33" y="20" width="36" height="4.5" rx="2.25" fill="#64748B"/>
      <rect x="33" y="29" width="27" height="4.5" rx="2.25" fill="#475569"/>
      <rect x="33" y="38" width="32" height="4.5" rx="2.25" fill="#64748B"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="742" fill="#0B1220"/>

  <!-- title -->
  <text x="60" y="66" font-size="40" font-weight="700" fill="#E2E8F0">cloud-email-archive</text>
  <text x="60" y="102" font-size="20" fill="#94A3B8">Encrypted email archive — IMAP in, opaque blobs into any synced cloud folder.</text>

  <!-- ══ stage 1: IMAP accounts (server rack + envelope) ══ -->
  <g>
    <g transform="rotate(-5 146 184)">
      <rect x="106" y="158" width="80" height="52" rx="6" fill="none" stroke="#7DD3FC" stroke-width="3"/>
      <path d="M110,164 L146,190 L182,164" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="96"  y="220" width="100" height="52" rx="6" fill="#16233F" stroke="#3B5480" stroke-width="2"/>
    <rect x="96"  y="276" width="100" height="52" rx="6" fill="#16233F" stroke="#3B5480" stroke-width="2"/>
    <rect x="96"  y="332" width="100" height="52" rx="6" fill="#16233F" stroke="#3B5480" stroke-width="2"/>
    <circle cx="114" cy="246" r="4" fill="#34D399"/>
    <circle cx="114" cy="302" r="4" fill="#F59E0B"/>
    <circle cx="114" cy="358" r="4" fill="#64748B"/>
    <rect x="130" y="240" width="50" height="4" rx="2" fill="#334E7A"/>
    <rect x="130" y="250" width="38" height="4" rx="2" fill="#24354F"/>
    <rect x="130" y="296" width="50" height="4" rx="2" fill="#334E7A"/>
    <rect x="130" y="306" width="38" height="4" rx="2" fill="#24354F"/>
    <rect x="130" y="352" width="50" height="4" rx="2" fill="#334E7A"/>
    <rect x="130" y="362" width="38" height="4" rx="2" fill="#24354F"/>
    <text x="146" y="432" font-size="20" font-weight="600" fill="#E2E8F0" text-anchor="middle">your IMAP accounts</text>
    <text x="146" y="458" font-size="15" fill="#94A3B8" text-anchor="middle">Dovecot · Exchange · any</text>
  </g>

  <line x1="214" y1="306" x2="326" y2="306" stroke="#7DD3FC" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="270" y="290" font-size="14" fill="#64748B" text-anchor="middle">IMAP · TLS</text>

  <!-- ══ stage 2: client-side encryption (padlock in box) ══ -->
  <g>
    <rect x="340" y="230" width="160" height="160" rx="20" fill="#12213D" stroke="#4C7DB8" stroke-width="2.5"/>
    <path d="M400,306 v-22 a20,20 0 0 1 40,0 v22" fill="none" stroke="#F59E0B" stroke-width="9" stroke-linecap="round"/>
    <rect x="388" y="306" width="64" height="54" rx="9" fill="#F59E0B"/>
    <circle cx="420" cy="326" r="7" fill="#12213D"/>
    <rect x="417" y="330" width="6" height="16" rx="3" fill="#12213D"/>
    <text x="420" y="432" font-size="20" font-weight="600" fill="#E2E8F0" text-anchor="middle">client-side encryption</text>
    <text x="420" y="458" font-size="15" fill="#94A3B8" text-anchor="middle">age · key never leaves your machine</text>
  </g>

  <line x1="514" y1="306" x2="646" y2="306" stroke="#7DD3FC" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="580" y="290" font-size="14" fill="#64748B" text-anchor="middle">encrypted locally</text>

  <!-- ══ stage 3: archive folder with content-addressed blobs ══ -->
  <g>
    <path d="M660,254 q0,-9 9,-9 h56 l17,15 h96 q9,0 9,9 v141 q0,9 -9,9 h-169 q-9,0 -9,-9 Z"
          fill="#16233F" stroke="#3B5480" stroke-width="2.5"/>
    <use href="#blobcard" xlink:href="#blobcard" x="674" y="288" transform="rotate(-2 716 314)"/>
    <use href="#blobcard" xlink:href="#blobcard" x="674" y="316" transform="rotate(1.5 716 342)"/>
    <use href="#blobcard" xlink:href="#blobcard" x="674" y="344"/>
    <text x="750" y="460" font-size="20" font-weight="600" fill="#E2E8F0" text-anchor="middle">content-addressed blobs</text>
    <text x="750" y="486" font-size="15" fill="#94A3B8" text-anchor="middle">dedup · append-only · verifiable</text>
  </g>

  <line x1="856" y1="306" x2="962" y2="306" stroke="#7DD3FC" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="909" y="290" font-size="14" fill="#64748B" text-anchor="middle">folder sync</text>

  <!-- ══ stage 4: cloud + crossed-out eye ══ -->
  <g>
    <g transform="translate(982 200) scale(6)">
      <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"
            fill="#16233F" stroke="#7DD3FC" stroke-width="0.5" stroke-linejoin="round"/>
    </g>
    <use href="#blobcard" xlink:href="#blobcard" transform="translate(1006 246) scale(0.62)"/>
    <path d="M1020,398 C1040,372 1080,372 1100,398 C1080,424 1040,424 1020,398 Z"
          fill="none" stroke="#F87171" stroke-width="3.5"/>
    <circle cx="1060" cy="398" r="12" fill="none" stroke="#F87171" stroke-width="3.5"/>
    <line x1="1012" y1="432" x2="1108" y2="362" stroke="#F87171" stroke-width="6" stroke-linecap="round"/>
    <text x="1060" y="462" font-size="20" font-weight="600" fill="#E2E8F0" text-anchor="middle">provider sees nothing</text>
    <text x="1060" y="488" font-size="15" fill="#94A3B8" text-anchor="middle">only opaque .age blobs — any cloud</text>
  </g>

  <!-- ══ principles row ══ -->
  <g>
    <rect x="60" y="560" width="300" height="96" rx="14" fill="#101B31" stroke="#24354F" stroke-width="2"/>
    <rect x="84" y="588" width="40" height="30" rx="5" fill="none" stroke="#7DD3FC" stroke-width="2.5"/>
    <path d="M104,596 v14 M97,603 h14" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    <text x="142" y="606" font-size="20" font-weight="600" fill="#E2E8F0">append-only</text>
    <text x="142" y="632" font-size="15" fill="#94A3B8">nothing is ever deleted</text>
  </g>
  <g>
    <rect x="450" y="560" width="300" height="96" rx="14" fill="#101B31" stroke="#24354F" stroke-width="2"/>
    <rect x="474" y="586" width="26" height="20" rx="3" fill="none" stroke="#7DD3FC" stroke-width="2"/>
    <rect x="474" y="612" width="26" height="20" rx="3" fill="none" stroke="#7DD3FC" stroke-width="2"/>
    <path d="M504,609 h18" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="528" y="597" width="30" height="24" rx="4" fill="#1B2A4A" stroke="#34D399" stroke-width="2.5"/>
    <text x="576" y="606" font-size="20" font-weight="600" fill="#E2E8F0">deduplicated</text>
    <text x="576" y="632" font-size="15" fill="#94A3B8">identical mail stored once</text>
  </g>
  <g>
    <rect x="840" y="560" width="300" height="96" rx="14" fill="#101B31" stroke="#24354F" stroke-width="2"/>
    <path d="M864,586 l16,-7 l16,7 v15 q0,15 -16,21 q-16,-6 -16,-21 Z" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M872,601 l7,7 l13,-14" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="916" y="606" font-size="20" font-weight="600" fill="#E2E8F0">verifiable</text>
    <text x="916" y="632" font-size="15" fill="#94A3B8">decrypt-check every blob</text>
  </g>

  <!-- footer -->
  <text x="1140" y="708" font-size="14" fill="#64748B" text-anchor="end">single static Go binary · age (X25519 + ChaCha20-Poly1305) · pure-Go IMAP</text>
</svg>
